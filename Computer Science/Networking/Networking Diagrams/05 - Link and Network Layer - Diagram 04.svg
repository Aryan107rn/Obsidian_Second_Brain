<svg xmlns="http://www.w3.org/2000/svg" width="640" height="446" viewBox="0 0 640 446">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#60748f"/></marker><marker id="dash" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7086a6"/></marker></defs>
<rect width="100%" height="100%" rx="18" fill="#fbfcff"/>
<rect x="28" y="18" width="144" height="42" rx="12" fill="#e9f1ff" stroke="#7094c8" stroke-width="2.5"/>
<text x="100" y="44" text-anchor="middle" font-family="Inter,Arial" font-size="13" fill="#17243a">New device (no IP)</text>
<path d="M100 60 V421" stroke="#a6b4c7" stroke-dasharray="5 5"/>
<rect x="238" y="18" width="144" height="42" rx="12" fill="#e9f1ff" stroke="#7094c8" stroke-width="2.5"/>
<text x="310" y="44" text-anchor="middle" font-family="Inter,Arial" font-size="13" fill="#17243a">DHCP server (router)</text>
<path d="M310 60 V421" stroke="#a6b4c7" stroke-dasharray="5 5"/>
<path d="M100 90 H310" stroke="#60748f" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="205.0" y="81" text-anchor="middle" font-family="Inter,Arial" font-size="11" fill="#33435c"><tspan x="205.0" dy="0">DISCOVER (broadcast): anyone give me an address?</tspan></text>
<path d="M310 172 H100" stroke="#60748f" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="205.0" y="163" text-anchor="middle" font-family="Inter,Arial" font-size="11" fill="#33435c"><tspan x="205.0" dy="0">OFFER: you can have 192.168.1.23 for 24h</tspan></text>
<path d="M100 254 H310" stroke="#60748f" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="205.0" y="245" text-anchor="middle" font-family="Inter,Arial" font-size="11" fill="#33435c"><tspan x="205.0" dy="0">REQUEST: I accept 192.168.1.23</tspan></text>
<path d="M310 336 H100" stroke="#60748f" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="205.0" y="327" text-anchor="middle" font-family="Inter,Arial" font-size="11" fill="#33435c"><tspan x="205.0" dy="0">ACK: confirmed, plus gateway and DNS</tspan></text>
</svg>