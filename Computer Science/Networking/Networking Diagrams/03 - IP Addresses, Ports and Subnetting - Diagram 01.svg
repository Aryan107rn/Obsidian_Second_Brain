<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650" role="img" aria-labelledby="title desc"><title id="title">One server port accepts distinct TCP connections</title><desc id="desc">Three client endpoints connect to one server endpoint. Different client IPs or ephemeral ports make each TCP four-tuple unique.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e78a30"/></marker></defs><g font-family="Arial,sans-serif"><text x="590" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#f4f7fc">Many TCP connections can share one server port</text><text x="590" y="76" text-anchor="middle" font-size="16" fill="#cbd5e1">The client-side IP and ephemeral port distinguish each connection</text>
<text x="220" y="122" text-anchor="middle" font-size="17" font-weight="700" fill="#dbeafe">Client endpoints</text><text x="890" y="122" text-anchor="middle" font-size="17" font-weight="700" fill="#dbeafe">Server endpoint · 203.0.113.7:443</text>
<rect x="60" y="146" width="320" height="92" rx="16" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="220" y="181" text-anchor="middle" font-size="18" font-weight="700" fill="#17243a">Client A · tab 1</text><text x="220" y="211" text-anchor="middle" font-size="17" fill="#334155">10.0.0.5:51000</text>
<rect x="60" y="286" width="320" height="92" rx="16" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="220" y="321" text-anchor="middle" font-size="18" font-weight="700" fill="#17243a">Client A · tab 2</text><text x="220" y="351" text-anchor="middle" font-size="17" fill="#334155">10.0.0.5:51001</text>
<rect x="60" y="426" width="320" height="92" rx="16" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="220" y="461" text-anchor="middle" font-size="18" font-weight="700" fill="#17243a">Client B</text><text x="220" y="491" text-anchor="middle" font-size="17" fill="#334155">198.51.100.9:40222</text>
<rect x="720" y="136" width="400" height="404" rx="18" fill="#eaf0ff" stroke="#7899c8" stroke-width="2"/><text x="920" y="178" text-anchor="middle" font-size="19" font-weight="700" fill="#17243a">One listening port</text><text x="920" y="207" text-anchor="middle" font-size="18" fill="#334155">HTTPS · TCP port 443</text>
<rect x="752" y="238" width="336" height="70" rx="12" fill="#f4f7fc" stroke="#9cb1d0"/><text x="920" y="281" text-anchor="middle" font-size="16" fill="#17243a">Accepted socket A · client port 51000</text><rect x="752" y="326" width="336" height="70" rx="12" fill="#f4f7fc" stroke="#9cb1d0"/><text x="920" y="369" text-anchor="middle" font-size="16" fill="#17243a">Accepted socket B · client port 51001</text><rect x="752" y="414" width="336" height="70" rx="12" fill="#f4f7fc" stroke="#9cb1d0"/><text x="920" y="457" text-anchor="middle" font-size="16" fill="#17243a">Accepted socket C · client B</text>
<path d="M380 192H690Q704 192 704 238H752" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><path d="M380 332H752" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><path d="M380 472H690Q704 472 704 449H752" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="160" y="558" width="860" height="54" rx="14" fill="#fff1d6" stroke="#d7b965" stroke-width="2"/><text x="590" y="592" text-anchor="middle" font-size="18" font-weight="700" fill="#3b321d">Each connection has its own 4-tuple: client IP, client port, server IP, server port</text></g></svg>