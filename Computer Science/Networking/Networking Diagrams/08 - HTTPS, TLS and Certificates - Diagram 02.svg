<svg xmlns="http://www.w3.org/2000/svg" width="640" height="692" viewBox="0 0 640 692">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#60748f"/></marker><marker id="dash" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7086a6"/></marker></defs>
<rect width="100%" height="100%" rx="18" fill="#fbfcff"/>
<rect x="28" y="18" width="144" height="42" rx="12" fill="#e9f1ff" stroke="#7094c8" stroke-width="2.5"/>
<text x="100" y="44" text-anchor="middle" font-family="Inter,Arial" font-size="13" fill="#17243a">Client (browser)</text>
<path d="M100 60 V667" stroke="#a6b4c7" stroke-dasharray="5 5"/>
<rect x="238" y="18" width="144" height="42" rx="12" fill="#e9f1ff" stroke="#7094c8" stroke-width="2.5"/>
<text x="310" y="44" text-anchor="middle" font-family="Inter,Arial" font-size="13" fill="#17243a">Server</text>
<path d="M310 60 V667" stroke="#a6b4c7" stroke-dasharray="5 5"/>
<path d="M100 90 H310" stroke="#60748f" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="205.0" y="81" text-anchor="middle" font-family="Inter,Arial" font-size="11" fill="#33435c"><tspan x="205.0" dy="0">ClientHello: TLS versions, cipher suites, key share </tspan><tspan x="205.0" dy="13">(ECDHE public value), SNI</tspan></text>
<path d="M310 172 H100" stroke="#60748f" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="205.0" y="163" text-anchor="middle" font-family="Inter,Arial" font-size="11" fill="#33435c"><tspan x="205.0" dy="0">ServerHello: chosen cipher + server&#x27;s key share</tspan></text>
<path d="M310 254 H100" stroke="#60748f" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="205.0" y="245" text-anchor="middle" font-family="Inter,Arial" font-size="11" fill="#33435c"><tspan x="205.0" dy="0">Certificate + CertificateVerify (signature proving p</tspan><tspan x="205.0" dy="13">rivate key) + Finished</tspan></text>
<path d="M100 336 h48 v24 h-36" fill="none" stroke="#60748f" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="124" y="327" text-anchor="middle" font-family="Inter,Arial" font-size="11" fill="#33435c"><tspan x="124" dy="0">Validate certificate chain, hostname, signature</tspan></text>
<path d="M100 418 H310" stroke="#60748f" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="205.0" y="409" text-anchor="middle" font-family="Inter,Arial" font-size="11" fill="#33435c"><tspan x="205.0" dy="0">Finished</tspan></text>
<path d="M100 500 H310" stroke="#60748f" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="205.0" y="491" text-anchor="middle" font-family="Inter,Arial" font-size="11" fill="#33435c"><tspan x="205.0" dy="0">HTTP request (encrypted)</tspan></text>
<path d="M310 582 H100" stroke="#60748f" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="205.0" y="573" text-anchor="middle" font-family="Inter,Arial" font-size="11" fill="#33435c"><tspan x="205.0" dy="0">HTTP response (encrypted)</tspan></text>
