<text x="205.0" y="81" text-anchor="middle" font-family="Inter,Arial" font-size="11" fill="#33435c"><tspan x="205.0" dy="0">1. SYN (seq=x)  &quot;I want to connect, my numbers start</tspan><tspan x="205.0" dy="13"> at x</tspan></text>
