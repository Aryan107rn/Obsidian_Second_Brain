<text x="205.0" y="163" text-anchor="middle" font-family="Inter,Arial" font-size="11" fill="#33435c"><tspan x="205.0" dy="0">2. SYN-ACK (seq=y, ack=x+1)  &quot;OK, mine start at y, I</tspan><tspan x="205.0" dy="13"> got your x</tspan></text>
