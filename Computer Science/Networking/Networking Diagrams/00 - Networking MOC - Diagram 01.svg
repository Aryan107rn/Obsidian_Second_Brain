<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="938" viewBox="0 0 1250 938">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#60748f"/></marker><marker id="dash" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7086a6"/></marker></defs>
<rect width="100%" height="100%" rx="18" fill="#fbfcff"/>
<rect x="28" y="18" width="144" height="42" rx="12" fill="#e9f1ff" stroke="#7094c8" stroke-width="2.5"/>
<text x="100" y="44" text-anchor="middle" font-family="Inter,Arial" font-size="13" fill="#17243a">Browser</text>
<path d="M100 60 V913" stroke="#a6b4c7" stroke-dasharray="5 5"/>
<rect x="238" y="18" width="144" height="42" rx="12" fill="#e9f1ff" stroke="#7094c8" stroke-width="2.5"/>
<text x="310" y="44" text-anchor="middle" font-family="Inter,Arial" font-size="13" fill="#17243a">DNS (recursive resolver)</text>
<path d="M310 60 V913" stroke="#a6b4c7" stroke-dasharray="5 5"/>
<rect x="448" y="18" width="144" height="42" rx="12" fill="#e9f1ff" stroke="#7094c8" stroke-width="2.5"/>
<text x="520" y="44" text-anchor="middle" font-family="Inter,Arial" font-size="13" fill="#17243a">Reverse proxy / Load balancer</text>
<path d="M520 60 V913" stroke="#a6b4c7" stroke-dasharray="5 5"/>
<rect x="658" y="18" width="144" height="42" rx="12" fill="#e9f1ff" stroke="#7094c8" stroke-width="2.5"/>
<text x="730" y="44" text-anchor="middle" font-family="Inter,Arial" font-size="13" fill="#17243a">Node/Express app</text>
<path d="M730 60 V913" stroke="#a6b4c7" stroke-dasharray="5 5"/>
<rect x="868" y="18" width="144" height="42" rx="12" fill="#e9f1ff" stroke="#7094c8" stroke-width="2.5"/>
<text x="940" y="44" text-anchor="middle" font-family="Inter,Arial" font-size="13" fill="#17243a">Database</text>
<path d="M940 60 V913" stroke="#a6b4c7" stroke-dasharray="5 5"/>
<path d="M100 90 H310" stroke="#60748f" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="205.0" y="81" text-anchor="middle" font-family="Inter,Arial" font-size="11" fill="#33435c"><tspan x="205.0" dy="0">1. DNS: api.example.com → IP  (06)</tspan></text>
<path d="M310 172 H100" stroke="#60748f" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#dash)"/>
<text x="205.0" y="163" text-anchor="middle" font-family="Inter,Arial" font-size="11" fill="#33435c"><tspan x="205.0" dy="0">203.0.113.7</tspan></text>
<path d="M100 254 H520" stroke="#60748f" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="310.0" y="245" text-anchor="middle" font-family="Inter,Arial" font-size="11" fill="#33435c"><tspan x="310.0" dy="0">2. TCP handshake SYN / SYN-ACK / ACK  (04)</tspan></text>
<path d="M100 336 H520" stroke="#60748f" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="310.0" y="327" text-anchor="middle" font-family="Inter,Arial" font-size="11" fill="#33435c"><tspan x="310.0" dy="0">3. TLS handshake: certificate, keys  (08)</tspan></text>
<path d="M100 418 H520" stroke="#60748f" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="310.0" y="409" text-anchor="middle" font-family="Inter,Arial" font-size="11" fill="#33435c"><tspan x="310.0" dy="0">4. HTTP request: GET /users + headers + cookie  (07,</tspan><tspan x="310.0" dy="13"> 09)</tspan></text>
<path d="M520 500 H730" stroke="#60748f" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="625.0" y="491" text-anchor="middle" font-family="Inter,Arial" font-size="11" fill="#33435c"><tspan x="625.0" dy="0">5. Forward to a healthy instance  (10)</tspan></text>
<path d="M730 582 H940" stroke="#60748f" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="835.0" y="573" text-anchor="middle" font-family="Inter,Arial" font-size="11" fill="#33435c"><tspan x="835.0" dy="0">6. Query (another TCP connection)</tspan></text>
<path d="M940 664 H730" stroke="#60748f" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#dash)"/>
<text x="835.0" y="655" text-anchor="middle" font-family="Inter,Arial" font-size="11" fill="#33435c"><tspan x="835.0" dy="0">rows</tspan></text>
<path d="M730 746 H520" stroke="#60748f" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#dash)"/>
<text x="625.0" y="737" text-anchor="middle" font-family="Inter,Arial" font-size="11" fill="#33435c"><tspan x="625.0" dy="0">7. HTTP response 200 + JSON</tspan></text>
<path d="M520 828 H100" stroke="#60748f" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#dash)"/>
<text x="310.0" y="819" text-anchor="middle" font-family="Inter,Arial" font-size="11" fill="#33435c"><tspan x="310.0" dy="0">8. Response back (headers, body, cache rules)</tspan></text>
</svg>