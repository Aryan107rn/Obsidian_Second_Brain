<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">HTTP connection reuse</title><desc id="desc">Compare creating a new TCP and TLS connection for every request with reusing one keep-alive connection.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e78a30"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4f83cc"/></marker></defs><g font-family="Arial,sans-serif"><text x="600" y="44" text-anchor="middle" font-size="29" font-weight="700" fill="#f4f7fc">HTTP connection reuse reduces setup cost</text>
<rect x="38" y="78" width="540" height="570" rx="20" fill="#f8fafc" stroke="#7899c8" stroke-width="2"/><rect x="622" y="78" width="540" height="570" rx="20" fill="#f8fafc" stroke="#72b58c" stroke-width="2"/><text x="308" y="118" text-anchor="middle" font-size="23" font-weight="700" fill="#17243a">No reuse · repeated setup</text><text x="892" y="118" text-anchor="middle" font-size="23" font-weight="700" fill="#17243a">Keep-alive · reuse one connection</text>
<text x="160" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Client</text><text x="455" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Server</text><path d="M160 174V610M455 174V610" stroke="#9aa8bb" stroke-width="2" stroke-dasharray="7 7"/>
<text x="744" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Client</text><text x="1038" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Server</text><path d="M744 174V610M1038 174V610" stroke="#9aa8bb" stroke-width="2" stroke-dasharray="7 7"/>
<path d="M166 205H449" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><text x="308" y="197" text-anchor="middle" font-size="14" fill="#17243a">TCP + TLS setup</text><path d="M166 246H449" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><text x="308" y="238" text-anchor="middle" font-size="14" fill="#17243a">Request 1</text><path d="M449 280H166" stroke="#4f83cc" stroke-width="3" marker-end="url(#arrow-blue)"/><text x="308" y="273" text-anchor="middle" font-size="14" fill="#17243a">Response 1</text><path d="M166 316H449" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><text x="308" y="308" text-anchor="middle" font-size="14" fill="#17243a">Close connection</text>
<path d="M166 377H449" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><text x="308" y="369" text-anchor="middle" font-size="14" fill="#17243a">TCP + TLS setup again</text><path d="M166 418H449" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><text x="308" y="410" text-anchor="middle" font-size="14" fill="#17243a">Request 2</text><path d="M449 452H166" stroke="#4f83cc" stroke-width="3" marker-end="url(#arrow-blue)"/><text x="308" y="445" text-anchor="middle" font-size="14" fill="#17243a">Response 2</text><path d="M166 488H449" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><text x="308" y="480" text-anchor="middle" font-size="14" fill="#17243a">Close connection</text><text x="308" y="554" text-anchor="middle" font-size="15" font-weight="700" fill="#8a4b20">Every request pays the handshake cost</text>
<path d="M750 205H1032" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><text x="891" y="197" text-anchor="middle" font-size="14" fill="#17243a">TCP + TLS setup once</text><path d="M750 246H1032" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><text x="891" y="238" text-anchor="middle" font-size="14" fill="#17243a">Request 1</text><path d="M1032 280H750" stroke="#4f83cc" stroke-width="3" marker-end="url(#arrow-blue)"/><text x="891" y="273" text-anchor="middle" font-size="14" fill="#17243a">Response 1</text><path d="M750 316H1032" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><text x="891" y="308" text-anchor="middle" font-size="14" fill="#17243a">Request 2</text><path d="M1032 350H750" stroke="#4f83cc" stroke-width="3" marker-end="url(#arrow-blue)"/><text x="891" y="343" text-anchor="middle" font-size="14" fill="#17243a">Response 2</text><path d="M750 386H1032" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><text x="891" y="378" text-anchor="middle" font-size="14" fill="#17243a">Request 3</text><path d="M1032 420H750" stroke="#4f83cc" stroke-width="3" marker-end="url(#arrow-blue)"/><text x="891" y="413" text-anchor="middle" font-size="14" fill="#17243a">Response 3</text><path d="M750 456H1032" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><text x="891" y="448" text-anchor="middle" font-size="14" fill="#17243a">Close when finished</text><text x="891" y="554" text-anchor="middle" font-size="15" font-weight="700" fill="#276342">One handshake serves many requests</text>
<text x="600" y="682" text-anchor="middle" font-size="14" fill="#cbd5e1">HTTP/1.1 keep-alive reuses TCP/TLS; HTTP/2 multiplexes concurrent streams over that connection.</text></g></svg>