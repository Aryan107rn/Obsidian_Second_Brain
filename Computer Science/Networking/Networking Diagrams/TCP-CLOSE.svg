<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc"><title id="title">TCP connection close sequence</title><desc id="desc">TCP closes with four messages: client FIN, server ACK, server FIN, and client ACK.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e78a30"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4f83cc"/></marker></defs><g font-family="Arial,sans-serif"><text x="480" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#f4f7fc">TCP connection close · four-way exchange</text><rect x="115" y="82" width="230" height="60" rx="15" fill="#dce9ff" stroke="#7899c8" stroke-width="2"/><text x="230" y="120" text-anchor="middle" font-size="20" font-weight="700" fill="#17243a">Client</text><rect x="615" y="82" width="230" height="60" rx="15" fill="#dce9ff" stroke="#7899c8" stroke-width="2"/><text x="730" y="120" text-anchor="middle" font-size="20" font-weight="700" fill="#17243a">Server</text><path d="M230 150V500M730 150V500" stroke="#9aa8bb" stroke-width="2" stroke-dasharray="8 8"/>
<path d="M238 205H722" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="195" text-anchor="middle" font-size="17" font-weight="700" fill="#f4f7fc">1 · FIN — client has finished sending</text>
<path d="M722 280H238" stroke="#4f83cc" stroke-width="3" marker-end="url(#arrow-blue)"/><text x="480" y="270" text-anchor="middle" font-size="17" font-weight="700" fill="#f4f7fc">2 · ACK — server confirms</text>
<path d="M722 355H238" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="345" text-anchor="middle" font-size="17" font-weight="700" fill="#f4f7fc">3 · FIN — server has finished sending</text>
<path d="M238 430H722" stroke="#4f83cc" stroke-width="3" marker-end="url(#arrow-blue)"/><text x="480" y="420" text-anchor="middle" font-size="17" font-weight="700" fill="#f4f7fc">4 · ACK — client confirms</text>
<rect x="230" y="480" width="500" height="54" rx="13" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="480" y="514" text-anchor="middle" font-size="17" font-weight="700" fill="#17243a">The connection can now close; client enters TIME_WAIT</text></g></svg>