<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="722" viewBox="0 0 1320 722" role="img" aria-labelledby="title desc"><title id="title">String problem pattern guide</title><desc id="desc">A readable mapping of problem patterns to suitable algorithms, connected by arrows.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e78a30"/></marker></defs><g font-family="Arial,sans-serif"><text x="660" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#f4f7fc">String problem pattern guide</text><text x="660" y="76" text-anchor="middle" font-size="16" fill="#cbd5e1">Choose based on whether the task is about windows, counts, matching, or structure.</text><text x="320" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#dbeafe">Problem pattern</text><text x="1000" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#dbeafe">Suggested technique</text><rect x="55" y="132" width="530" height="68" rx="15" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="320" y="166.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="320" dy="0">Longest or shortest substring under a constraint</tspan></text><path d="M590 166H720" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="735" y="132" width="530" height="68" rx="15" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="1000" y="166.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="1000" dy="0">Sliding window</tspan></text><rect x="55" y="224" width="530" height="68" rx="15" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="320" y="258.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="320" dy="0">Character frequency, duplicates, or anagrams</tspan></text><path d="M590 258H720" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="735" y="224" width="530" height="68" rx="15" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="1000" y="258.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="1000" dy="0">Frequency counting / fixed-size count array</tspan></text><rect x="55" y="316" width="530" height="68" rx="15" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="320" y="350.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="320" dy="0">Find a pattern inside a larger text</tspan></text><path d="M590 350H720" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="735" y="316" width="530" height="68" rx="15" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="1000" y="350.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="1000" dy="0">KMP or Z algorithm; Rabin–Karp for rolling hashes</tspan></text><rect x="55" y="408" width="530" height="68" rx="15" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="320" y="442.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="320" dy="0">Prefix lookup or autocomplete</tspan></text><path d="M590 442H720" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="735" y="408" width="530" height="68" rx="15" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="1000" y="442.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="1000" dy="0">Trie</tspan></text><rect x="55" y="500" width="530" height="68" rx="15" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="320" y="534.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="320" dy="0">Compare structural similarity / common subsequence</tspan></text><path d="M590 534H720" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="735" y="500" width="530" height="68" rx="15" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="1000" y="534.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="1000" dy="0">Dynamic programming (LCS)</tspan></text><rect x="55" y="592" width="530" height="68" rx="15" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="320" y="626.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="320" dy="0">Check palindrome, symmetry, or reversal</tspan></text><path d="M590 626H720" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="735" y="592" width="530" height="68" rx="15" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="1000" y="626.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="1000" dy="0">Two pointers</tspan></text></g></svg>