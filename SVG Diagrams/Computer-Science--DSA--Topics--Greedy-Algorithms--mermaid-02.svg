<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="960" viewBox="0 0 1120 960" role="img" aria-labelledby="title desc"><title id="title">Greedy interval scheduling</title><desc id="desc">Sort by finish time, keep compatible intervals, skip overlaps, and repeat until no intervals remain.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e78a30"/></marker></defs><g font-family="Arial,sans-serif"><text x="560" y="42" text-anchor="middle" font-size="27" font-weight="700" fill="#f4f7fc">Activity selection: choose intervals by finish time</text>
<rect x="390" y="68" width="340" height="62" rx="15" fill="#dce9ff" stroke="#7899c8" stroke-width="2"/><text x="560" y="106" text-anchor="middle" font-size="18" fill="#17243a">Sort intervals by end time</text>
<path d="M560 130V157" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="390" y="164" width="340" height="62" rx="15" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="560" y="202" text-anchor="middle" font-size="18" fill="#17243a">Pick the first; set lastEnd and count</text>
<path d="M560 226V255" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><polygon points="560,258 735,318 560,378 385,318" fill="#eaf0ff" stroke="#7899c8" stroke-width="2"/><text x="560" y="314" text-anchor="middle" font-size="18" fill="#17243a">More intervals?</text><text x="560" y="338" text-anchor="middle" font-size="14" fill="#334155">in end-time order</text>
<path d="M385 318H322" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="337" y="286" width="45" height="23" rx="9" fill="#fff1d6"/><text x="359" y="302" text-anchor="middle" font-size="12" font-weight="700" fill="#694b13">NO</text><rect x="62" y="282" width="250" height="72" rx="15" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="187" y="325" text-anchor="middle" font-size="18" fill="#17243a">Return count</text>
<path d="M560 378V414" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="535" y="383" width="50" height="23" rx="9" fill="#d9f4e4"/><text x="560" y="399" text-anchor="middle" font-size="12" font-weight="700" fill="#175b3a">YES</text><polygon points="560,418 755,480 560,542 365,480" fill="#eaf0ff" stroke="#7899c8" stroke-width="2"/><text x="560" y="476" text-anchor="middle" font-size="17" fill="#17243a">next.start ≥ lastEnd?</text><text x="560" y="500" text-anchor="middle" font-size="14" fill="#334155">Does it fit?</text>
<path d="M365 480H285V625" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="295" y="500" width="45" height="23" rx="9" fill="#d9f4e4"/><text x="317" y="516" text-anchor="middle" font-size="12" font-weight="700" fill="#175b3a">YES</text>
<path d="M755 480H835V625" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="780" y="500" width="42" height="23" rx="9" fill="#fff1d6"/><text x="801" y="516" text-anchor="middle" font-size="12" font-weight="700" fill="#694b13">NO</text>
<rect x="75" y="632" width="420" height="88" rx="15" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="285" y="668" text-anchor="middle" font-size="17" fill="#17243a">Take it</text><text x="285" y="694" text-anchor="middle" font-size="15" fill="#334155">lastEnd = next.end; count++</text>
<rect x="625" y="632" width="420" height="88" rx="15" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="835" y="681" text-anchor="middle" font-size="17" fill="#17243a">Skip the overlapping interval</text>
<path d="M285 720V773H475" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><path d="M835 720V773H645" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="435" y="744" width="250" height="62" rx="15" fill="#dce9ff" stroke="#7899c8" stroke-width="2"/><text x="560" y="782" text-anchor="middle" font-size="17" fill="#17243a">Advance to next interval</text>
<path d="M685 775H1080V318H741" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="1000" y="526" width="70" height="25" rx="9" fill="#f4f7fc" stroke="#7899c8"/><text x="1035" y="543" text-anchor="middle" font-size="13" font-weight="700" fill="#17243a">REPEAT</text>
</g></svg>