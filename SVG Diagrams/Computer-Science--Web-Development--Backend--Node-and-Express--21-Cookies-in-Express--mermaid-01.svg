<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="564" viewBox="0 0 1200 564" role="img" aria-labelledby="title desc"><title id="title">How a browser stores and returns a cookie</title><desc id="desc">A message sequence with explicit sender, receiver, direction arrows, and readable labels.</desc><defs><marker id="request" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e78a30"/></marker><marker id="response" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4f83cc"/></marker></defs><g font-family="Arial,sans-serif"><text x="600.0" y="44" text-anchor="middle" font-size="28" font-weight="700" fill="#f4f7fc">How a browser stores and returns a cookie</text><rect x="95" y="76" width="310" height="62" rx="15" fill="#dce9ff" stroke="#7899c8" stroke-width="2"/><text x="250" y="111.0" text-anchor="middle" font-size="17" fill="#17243a" font-weight="700"><tspan x="250" dy="0">Browser</tspan></text><path d="M250 145V516" stroke="#94a6bd" stroke-width="2" stroke-dasharray="7 8"/><rect x="795" y="76" width="310" height="62" rx="15" fill="#dce9ff" stroke="#7899c8" stroke-width="2"/><text x="950" y="111.0" text-anchor="middle" font-size="17" fill="#17243a" font-weight="700"><tspan x="950" dy="0">Web server</tspan></text><path d="M950 145V516" stroke="#94a6bd" stroke-width="2" stroke-dasharray="7 8"/><path d="M262 203H938" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#request)"/><rect x="505.0" y="170.0" width="190" height="26" rx="8" fill="#f4f7fc" stroke="#c7d4e5" stroke-width="1"/><text x="600.0" y="189.0" text-anchor="middle" font-size="15" fill="#17243a"><tspan x="600.0" dy="0">GET / · no cookie yet</tspan></text><path d="M938 279H262" fill="none" stroke="#4f83cc" stroke-width="3" marker-end="url(#response)"/><rect x="465.0" y="246.0" width="270" height="26" rx="8" fill="#f4f7fc" stroke="#c7d4e5" stroke-width="1"/><text x="600.0" y="265.0" text-anchor="middle" font-size="15" fill="#17243a"><tspan x="600.0" dy="0">200 OK + Set-Cookie: theme=dark</tspan></text><path d="M262 355H938" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#request)"/><rect x="465.0" y="322.0" width="270" height="26" rx="8" fill="#f4f7fc" stroke="#c7d4e5" stroke-width="1"/><text x="600.0" y="341.0" text-anchor="middle" font-size="15" fill="#17243a"><tspan x="600.0" dy="0">GET /about · Cookie: theme=dark</tspan></text><path d="M938 431H262" fill="none" stroke="#4f83cc" stroke-width="3" marker-end="url(#response)"/><rect x="421.0" y="398.0" width="358" height="26" rx="8" fill="#f4f7fc" stroke="#c7d4e5" stroke-width="1"/><text x="600.0" y="417.0" text-anchor="middle" font-size="15" fill="#17243a"><tspan x="600.0" dy="0">200 OK · server reads the saved preference</tspan></text><rect x="156.0" y="522" width="888.0" height="40" rx="12" fill="#fff1d6" stroke="#d7b965"/><text x="600.0" y="547" text-anchor="middle" font-size="14" font-weight="700" fill="#694b13">The browser returns a cookie only to matching domains and paths, subject to its cookie settings.</text></g></svg>