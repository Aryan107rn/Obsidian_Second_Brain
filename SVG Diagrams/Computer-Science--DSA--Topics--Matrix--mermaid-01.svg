<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="906" viewBox="0 0 1320 906" role="img" aria-labelledby="title desc"><title id="title">Matrix problem decision guide</title><desc id="desc">A readable mapping of problem patterns to suitable algorithms, connected by arrows.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e78a30"/></marker></defs><g font-family="Arial,sans-serif"><text x="660" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#f4f7fc">Matrix problem decision guide</text><text x="660" y="76" text-anchor="middle" font-size="16" fill="#cbd5e1">Look for the ordering, traversal, connectivity, or recurrence in the grid.</text><text x="320" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#dbeafe">Problem pattern</text><text x="1000" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#dbeafe">Suggested technique</text><rect x="55" y="132" width="530" height="68" rx="15" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="320" y="166.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="320" dy="0">Rotate a square matrix in place</tspan></text><path d="M590 166H720" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="735" y="132" width="530" height="68" rx="15" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="1000" y="166.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="1000" dy="0">Transpose, then reverse each row</tspan></text><rect x="55" y="224" width="530" height="68" rx="15" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="320" y="258.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="320" dy="0">Visit cells in spiral or diagonal order</tspan></text><path d="M590 258H720" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="735" y="224" width="530" height="68" rx="15" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="1000" y="258.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="1000" dy="0">Maintain shrinking boundaries / diagonal indices</tspan></text><rect x="55" y="316" width="530" height="68" rx="15" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="320" y="350.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="320" dy="0">Find connected regions or count islands</tspan></text><path d="M590 350H720" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="735" y="316" width="530" height="68" rx="15" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="1000" y="350.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="1000" dy="0">Flood fill with DFS or BFS</tspan></text><rect x="55" y="408" width="530" height="68" rx="15" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="320" y="442.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="320" dy="0">Shortest path in an unweighted grid</tspan></text><path d="M590 442H720" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="735" y="408" width="530" height="68" rx="15" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="1000" y="442.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="1000" dy="0">BFS; use Dijkstra when movement has costs</tspan></text><rect x="55" y="500" width="530" height="68" rx="15" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="320" y="534.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="320" dy="0">Count paths or optimize a grid path</tspan></text><path d="M590 534H720" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="735" y="500" width="530" height="68" rx="15" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="1000" y="534.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="1000" dy="0">Dynamic programming on the grid</tspan></text><rect x="55" y="592" width="530" height="68" rx="15" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="320" y="626.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="320" dy="0">Zero rows and columns based on a marker condition</tspan></text><path d="M590 626H720" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="735" y="592" width="530" height="68" rx="15" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="1000" y="626.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="1000" dy="0">Use first row / column as O(1)-space markers</tspan></text><rect x="55" y="684" width="530" height="68" rx="15" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="320" y="718.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="320" dy="0">Each row is sorted independently</tspan></text><path d="M590 718H720" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="735" y="684" width="530" height="68" rx="15" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="1000" y="718.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="1000" dy="0">Binary search the relevant row</tspan></text><rect x="55" y="776" width="530" height="68" rx="15" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="320" y="810.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="320" dy="0">Rows and columns are both sorted</tspan></text><path d="M590 810H720" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="735" y="776" width="530" height="68" rx="15" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="1000" y="810.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="1000" dy="0">Start at top-right; move left or down</tspan></text></g></svg>