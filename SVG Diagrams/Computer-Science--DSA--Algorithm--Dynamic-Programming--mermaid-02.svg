<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" role="img" aria-labelledby="title desc"><title id="title">Dynamic programming execution patterns</title><desc id="desc">Top-down memoization and bottom-up tabulation reuse solutions to subproblems.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e78a30"/></marker></defs><g font-family="Arial,sans-serif"><text x="620" y="44" text-anchor="middle" font-size="28" font-weight="700" fill="#f4f7fc">Two ways to evaluate a DP recurrence</text><text x="620" y="74" text-anchor="middle" font-size="16" fill="#cbd5e1">Both approaches solve each subproblem once and reuse its result</text><rect x="50" y="100" width="550" height="640" rx="20" fill="#f8fafc" stroke="#7899c8" stroke-width="2"/><rect x="640" y="100" width="550" height="640" rx="20" fill="#f8fafc" stroke="#72b58c" stroke-width="2"/><text x="325" y="142" text-anchor="middle" font-size="23" font-weight="700" fill="#17243a">Top-down · memoization</text><text x="915" y="142" text-anchor="middle" font-size="23" font-weight="700" fill="#17243a">Bottom-up · tabulation</text><rect x="80" y="180" width="490" height="78" rx="15" fill="#dce9ff" stroke="#7899c8" stroke-width="2"/><text x="325" y="223.0" text-anchor="middle" font-size="17" fill="#17243a"><tspan x="325" dy="0">Call dp(n)</tspan></text><path d="M325 258V296" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="308" width="490" height="78" rx="15" fill="#dce9ff" stroke="#7899c8" stroke-width="2"/><text x="325" y="351.0" text-anchor="middle" font-size="17" fill="#17243a"><tspan x="325" dy="0">Check whether dp[n] is cached</tspan></text><path d="M325 386V424" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="436" width="490" height="78" rx="15" fill="#dce9ff" stroke="#7899c8" stroke-width="2"/><text x="325" y="479.0" text-anchor="middle" font-size="17" fill="#17243a"><tspan x="325" dy="0">On a miss, solve smaller states recursively</tspan></text><path d="M325 514V552" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="564" width="490" height="78" rx="15" fill="#dce9ff" stroke="#7899c8" stroke-width="2"/><text x="325" y="607.0" text-anchor="middle" font-size="17" fill="#17243a"><tspan x="325" dy="0">Store dp[n] and return the result</tspan></text><rect x="670" y="180" width="490" height="78" rx="15" fill="#e3f6eb" stroke="#7899c8" stroke-width="2"/><text x="915" y="223.0" text-anchor="middle" font-size="17" fill="#17243a"><tspan x="915" dy="0">Write the base cases</tspan></text><path d="M915 258V296" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="670" y="308" width="490" height="78" rx="15" fill="#e3f6eb" stroke="#7899c8" stroke-width="2"/><text x="915" y="351.0" text-anchor="middle" font-size="17" fill="#17243a"><tspan x="915" dy="0">Visit states in dependency order</tspan></text><path d="M915 386V424" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="670" y="436" width="490" height="78" rx="15" fill="#e3f6eb" stroke="#7899c8" stroke-width="2"/><text x="915" y="479.0" text-anchor="middle" font-size="17" fill="#17243a"><tspan x="915" dy="0">Compute dp[i] from earlier states</tspan></text><path d="M915 514V552" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="670" y="564" width="490" height="78" rx="15" fill="#e3f6eb" stroke="#7899c8" stroke-width="2"/><text x="915" y="607.0" text-anchor="middle" font-size="17" fill="#17243a"><tspan x="915" dy="0">Return dp[n]</tspan></text><rect x="111" y="692" width="428" height="30" rx="10" fill="#fff1d6"/><text x="325" y="713" text-anchor="middle" font-size="14" fill="#694b13">Cache hit? Return immediately without recomputing.</text></g></svg>