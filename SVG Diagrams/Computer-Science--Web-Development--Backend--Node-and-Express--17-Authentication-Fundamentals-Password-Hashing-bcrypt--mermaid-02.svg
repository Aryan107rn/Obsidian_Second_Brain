<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="792" viewBox="0 0 1440 792" role="img" aria-labelledby="title desc"><title id="title">Cookie-based session authentication</title><desc id="desc">A message sequence with explicit sender, receiver, direction arrows, and readable labels.</desc><defs><marker id="request" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e78a30"/></marker><marker id="response" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4f83cc"/></marker></defs><g font-family="Arial,sans-serif"><text x="720.0" y="44" text-anchor="middle" font-size="28" font-weight="700" fill="#f4f7fc">Cookie-based session authentication</text><rect x="15" y="76" width="310" height="62" rx="15" fill="#dce9ff" stroke="#7899c8" stroke-width="2"/><text x="170" y="111.0" text-anchor="middle" font-size="17" fill="#17243a" font-weight="700"><tspan x="170" dy="0">Client / browser</tspan></text><path d="M170 145V744" stroke="#94a6bd" stroke-width="2" stroke-dasharray="7 8"/><rect x="565" y="76" width="310" height="62" rx="15" fill="#dce9ff" stroke="#7899c8" stroke-width="2"/><text x="720" y="111.0" text-anchor="middle" font-size="17" fill="#17243a" font-weight="700"><tspan x="720" dy="0">Express server</tspan></text><path d="M720 145V744" stroke="#94a6bd" stroke-width="2" stroke-dasharray="7 8"/><rect x="1115" y="76" width="310" height="62" rx="15" fill="#dce9ff" stroke="#7899c8" stroke-width="2"/><text x="1270" y="111.0" text-anchor="middle" font-size="17" fill="#17243a" font-weight="700"><tspan x="1270" dy="0">Session store</tspan></text><path d="M1270 145V744" stroke="#94a6bd" stroke-width="2" stroke-dasharray="7 8"/><path d="M182 203H708" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#request)"/><rect x="306.0" y="170.0" width="278" height="26" rx="8" fill="#f4f7fc" stroke="#c7d4e5" stroke-width="1"/><text x="445.0" y="189.0" text-anchor="middle" font-size="15" fill="#17243a"><tspan x="445.0" dy="0">POST /login · email and password</tspan></text><path d="M732 279H1258" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#request)"/><rect x="872.0" y="246.0" width="246" height="26" rx="8" fill="#f4f7fc" stroke="#c7d4e5" stroke-width="1"/><text x="995.0" y="265.0" text-anchor="middle" font-size="15" fill="#17243a"><tspan x="995.0" dy="0">Save session id 91 → user 42</tspan></text><path d="M708 355H182" fill="none" stroke="#4f83cc" stroke-width="3" marker-end="url(#response)"/><rect x="362.0" y="322.0" width="166" height="26" rx="8" fill="#f4f7fc" stroke="#c7d4e5" stroke-width="1"/><text x="445.0" y="341.0" text-anchor="middle" font-size="15" fill="#17243a"><tspan x="445.0" dy="0">Set-Cookie: sid=91</tspan></text><path d="M182 431H708" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#request)"/><rect x="318.0" y="398.0" width="254" height="26" rx="8" fill="#f4f7fc" stroke="#c7d4e5" stroke-width="1"/><text x="445.0" y="417.0" text-anchor="middle" font-size="15" fill="#17243a"><tspan x="445.0" dy="0">GET /profile · Cookie: sid=91</tspan></text><path d="M732 507H1258" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#request)"/><rect x="900.0" y="474.0" width="190" height="26" rx="8" fill="#f4f7fc" stroke="#c7d4e5" stroke-width="1"/><text x="995.0" y="493.0" text-anchor="middle" font-size="15" fill="#17243a"><tspan x="995.0" dy="0">Look up session id 91</tspan></text><path d="M1258 583H732" fill="none" stroke="#4f83cc" stroke-width="3" marker-end="url(#response)"/><rect x="880.0" y="550.0" width="230" height="26" rx="8" fill="#f4f7fc" stroke="#c7d4e5" stroke-width="1"/><text x="995.0" y="569.0" text-anchor="middle" font-size="15" fill="#17243a"><tspan x="995.0" dy="0">Session belongs to user 42</tspan></text><path d="M708 659H182" fill="none" stroke="#4f83cc" stroke-width="3" marker-end="url(#response)"/><rect x="358.0" y="626.0" width="174" height="26" rx="8" fill="#f4f7fc" stroke="#c7d4e5" stroke-width="1"/><text x="445.0" y="645.0" text-anchor="middle" font-size="15" fill="#17243a"><tspan x="445.0" dy="0">Return profile data</tspan></text><rect x="187.20000000000002" y="750" width="1065.6" height="40" rx="12" fill="#fff1d6" stroke="#d7b965"/><text x="720.0" y="775" text-anchor="middle" font-size="14" font-weight="700" fill="#694b13">The browser stores only the session ID; the server looks up the session data.</text></g></svg>