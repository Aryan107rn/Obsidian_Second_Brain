<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1120" viewBox="0 0 1240 1120" role="img" aria-labelledby="title desc"><title id="title">Greedy pattern decision flow</title><desc id="desc">A readable sequence of questions, with yes branches leading to greedy patterns and no branches continuing downward.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e78a30"/></marker></defs><rect width="100%" height="100%" fill="transparent"/><g font-family="Arial, sans-serif"><text x="620" y="45" text-anchor="middle" font-size="28" font-weight="700" fill="#f4f7fc">Greedy pattern decision flow</text><text x="620" y="73" text-anchor="middle" font-size="16" fill="#cbd5e1">Follow the first matching rule; prove the local choice is safe</text><rect x="52" y="106" width="650" height="72" rx="16" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="377" y="150" text-anchor="middle" font-size="18" fill="#17243a">Can you choose the maximum number of non-overlapping intervals?</text><path d="M702 142H788" stroke="#e78a30" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="725" y="111" width="48" height="24" rx="10" fill="#d9f4e4"/><text x="749" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#175b3a">YES</text><rect x="800" y="106" width="388" height="72" rx="16" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="994" y="130" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="994" dy="0">Sort by end time → activity selection</tspan><tspan x="994" dy="21">or minimum removals</tspan></text><path d="M377 178V209" stroke="#e78a30" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="352" y="181" width="50" height="22" rx="9" fill="#fff1d6"/><text x="377" y="197" text-anchor="middle" font-size="12" font-weight="700" fill="#694b13">NO</text><rect x="52" y="216" width="650" height="72" rx="16" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="377" y="260" text-anchor="middle" font-size="18" fill="#17243a">Are items divisible and limited by a capacity?</text><path d="M702 252H788" stroke="#e78a30" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="725" y="221" width="48" height="24" rx="10" fill="#d9f4e4"/><text x="749" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#175b3a">YES</text><rect x="800" y="216" width="388" height="72" rx="16" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="994" y="246" text-anchor="middle" font-size="16" fill="#17243a">Sort by value ÷ weight → fractional knapsack</text><path d="M377 288V319" stroke="#e78a30" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="352" y="291" width="50" height="22" rx="9" fill="#fff1d6"/><text x="377" y="307" text-anchor="middle" font-size="12" font-weight="700" fill="#694b13">NO</text><rect x="52" y="326" width="650" height="72" rx="16" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="377" y="370" text-anchor="middle" font-size="18" fill="#17243a">Must you reach an endpoint or minimize jumps?</text><path d="M702 362H788" stroke="#e78a30" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="725" y="331" width="48" height="24" rx="10" fill="#d9f4e4"/><text x="749" y="348" text-anchor="middle" font-size="13" font-weight="700" fill="#175b3a">YES</text><rect x="800" y="326" width="388" height="72" rx="16" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="994" y="356" text-anchor="middle" font-size="16" fill="#17243a">Track the farthest reachable position</text><path d="M377 398V429" stroke="#e78a30" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="352" y="401" width="50" height="22" rx="9" fill="#fff1d6"/><text x="377" y="417" text-anchor="middle" font-size="12" font-weight="700" fill="#694b13">NO</text><rect x="52" y="436" width="650" height="72" rx="16" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="377" y="480" text-anchor="middle" font-size="18" fill="#17243a">Does each result depend on both neighbors?</text><path d="M702 472H788" stroke="#e78a30" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="725" y="441" width="48" height="24" rx="10" fill="#d9f4e4"/><text x="749" y="458" text-anchor="middle" font-size="13" font-weight="700" fill="#175b3a">YES</text><rect x="800" y="436" width="388" height="72" rx="16" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="994" y="466" text-anchor="middle" font-size="16" fill="#17243a">Use two passes or a monotonic structure</text><path d="M377 508V539" stroke="#e78a30" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="352" y="511" width="50" height="22" rx="9" fill="#fff1d6"/><text x="377" y="527" text-anchor="middle" font-size="12" font-weight="700" fill="#694b13">NO</text><rect x="52" y="546" width="650" height="72" rx="16" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="377" y="590" text-anchor="middle" font-size="18" fill="#17243a">Must you remove k values for the smallest or largest result?</text><path d="M702 582H788" stroke="#e78a30" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="725" y="551" width="48" height="24" rx="10" fill="#d9f4e4"/><text x="749" y="568" text-anchor="middle" font-size="13" font-weight="700" fill="#175b3a">YES</text><rect x="800" y="546" width="388" height="72" rx="16" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="994" y="576" text-anchor="middle" font-size="16" fill="#17243a">Use a monotonic stack</text><path d="M377 618V649" stroke="#e78a30" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="352" y="621" width="50" height="22" rx="9" fill="#fff1d6"/><text x="377" y="637" text-anchor="middle" font-size="12" font-weight="700" fill="#694b13">NO</text><rect x="52" y="656" width="650" height="72" rx="16" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="377" y="700" text-anchor="middle" font-size="18" fill="#17243a">Do you repeatedly need the next smallest or largest item?</text><path d="M702 692H788" stroke="#e78a30" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="725" y="661" width="48" height="24" rx="10" fill="#d9f4e4"/><text x="749" y="678" text-anchor="middle" font-size="13" font-weight="700" fill="#175b3a">YES</text><rect x="800" y="656" width="388" height="72" rx="16" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="994" y="686" text-anchor="middle" font-size="16" fill="#17243a">Use a heap</text><path d="M377 728V759" stroke="#e78a30" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="352" y="731" width="50" height="22" rx="9" fill="#fff1d6"/><text x="377" y="747" text-anchor="middle" font-size="12" font-weight="700" fill="#694b13">NO</text><rect x="52" y="766" width="650" height="72" rx="16" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="377" y="810" text-anchor="middle" font-size="18" fill="#17243a">Does a custom order determine the best result?</text><path d="M702 802H788" stroke="#e78a30" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="725" y="771" width="48" height="24" rx="10" fill="#d9f4e4"/><text x="749" y="788" text-anchor="middle" font-size="13" font-weight="700" fill="#175b3a">YES</text><rect x="800" y="766" width="388" height="72" rx="16" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="994" y="796" text-anchor="middle" font-size="16" fill="#17243a">Sort with a custom comparator</text><path d="M377 838V869" stroke="#e78a30" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="352" y="841" width="50" height="22" rx="9" fill="#fff1d6"/><text x="377" y="857" text-anchor="middle" font-size="12" font-weight="700" fill="#694b13">NO</text><rect x="52" y="876" width="650" height="72" rx="16" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="377" y="920" text-anchor="middle" font-size="18" fill="#17243a">Are you matching two sorted groups?</text><path d="M702 912H788" stroke="#e78a30" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="725" y="881" width="48" height="24" rx="10" fill="#d9f4e4"/><text x="749" y="898" text-anchor="middle" font-size="13" font-weight="700" fill="#175b3a">YES</text><rect x="800" y="876" width="388" height="72" rx="16" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="994" y="906" text-anchor="middle" font-size="16" fill="#17243a">Sort, then use two pointers</text><path d="M377 948V979" stroke="#e78a30" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="352" y="951" width="50" height="22" rx="9" fill="#fff1d6"/><text x="377" y="967" text-anchor="middle" font-size="12" font-weight="700" fill="#694b13">NO</text><rect x="160" y="1015" width="920" height="70" rx="16" fill="#fff1d6" stroke="#d7b965" stroke-width="2"/><text x="620" y="1045" text-anchor="middle" font-size="17" font-weight="700" fill="#3b321d">No fit? Look for a counterexample; the problem may need dynamic programming.</text><text x="620" y="1070" text-anchor="middle" font-size="14" fill="#5b5138">A greedy choice needs a correctness argument, such as an exchange argument.</text></g></svg>