<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="630" viewBox="0 0 1050 630" role="img" aria-labelledby="title desc"><title id="title">Search a row and column sorted matrix</title><desc id="desc">Start at the top-right cell. Move down when the value is too small, left when too large, and stop on a match.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e78a30"/></marker></defs><g font-family="Arial,sans-serif"><text x="525" y="44" text-anchor="middle" font-size="27" font-weight="700" fill="#f4f7fc">Search a matrix sorted by rows and columns</text><text x="80" y="100" font-size="16" font-weight="700" fill="#dbeafe">Example: find 11</text><rect x="80" y="125" width="72" height="72" rx="12" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="116.0" y="170" text-anchor="middle" font-size="22" font-weight="700" fill="#17243a">1</text><rect x="164" y="125" width="72" height="72" rx="12" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="200.0" y="170" text-anchor="middle" font-size="22" font-weight="700" fill="#17243a">2</text><rect x="248" y="125" width="72" height="72" rx="12" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="284.0" y="170" text-anchor="middle" font-size="22" font-weight="700" fill="#17243a">3</text><rect x="332" y="125" width="72" height="72" rx="12" fill="#fff1d6" stroke="#7899c8" stroke-width="2"/><text x="368.0" y="170" text-anchor="middle" font-size="22" font-weight="700" fill="#17243a">4</text><rect x="80" y="209" width="72" height="72" rx="12" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="116.0" y="254" text-anchor="middle" font-size="22" font-weight="700" fill="#17243a">5</text><rect x="164" y="209" width="72" height="72" rx="12" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="200.0" y="254" text-anchor="middle" font-size="22" font-weight="700" fill="#17243a">6</text><rect x="248" y="209" width="72" height="72" rx="12" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="284.0" y="254" text-anchor="middle" font-size="22" font-weight="700" fill="#17243a">7</text><rect x="332" y="209" width="72" height="72" rx="12" fill="#fff1d6" stroke="#7899c8" stroke-width="2"/><text x="368.0" y="254" text-anchor="middle" font-size="22" font-weight="700" fill="#17243a">8</text><rect x="80" y="293" width="72" height="72" rx="12" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="116.0" y="338" text-anchor="middle" font-size="22" font-weight="700" fill="#17243a">9</text><rect x="164" y="293" width="72" height="72" rx="12" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="200.0" y="338" text-anchor="middle" font-size="22" font-weight="700" fill="#17243a">10</text><rect x="248" y="293" width="72" height="72" rx="12" fill="#e3f6eb" stroke="#7899c8" stroke-width="2"/><text x="284.0" y="338" text-anchor="middle" font-size="22" font-weight="700" fill="#17243a">11</text><rect x="332" y="293" width="72" height="72" rx="12" fill="#fff1d6" stroke="#7899c8" stroke-width="2"/><text x="368.0" y="338" text-anchor="middle" font-size="22" font-weight="700" fill="#17243a">12</text><rect x="80" y="377" width="72" height="72" rx="12" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="116.0" y="422" text-anchor="middle" font-size="22" font-weight="700" fill="#17243a">13</text><rect x="164" y="377" width="72" height="72" rx="12" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="200.0" y="422" text-anchor="middle" font-size="22" font-weight="700" fill="#17243a">14</text><rect x="248" y="377" width="72" height="72" rx="12" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="284.0" y="422" text-anchor="middle" font-size="22" font-weight="700" fill="#17243a">15</text><rect x="332" y="377" width="72" height="72" rx="12" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="368.0" y="422" text-anchor="middle" font-size="22" font-weight="700" fill="#17243a">16</text><path d="M368.0 199V206" stroke="#e78a30" stroke-width="4" marker-end="url(#arrow)"/><path d="M368.0 283V290" stroke="#e78a30" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 329.0H323" stroke="#e78a30" stroke-width="4" marker-end="url(#arrow)"/><rect x="480" y="142" width="500" height="112" rx="16" fill="#eaf0ff" stroke="#7899c8" stroke-width="2"/><text x="510" y="176" font-size="16" font-weight="700" fill="#334155">value &lt; target</text><text x="510" y="207" font-size="20" font-weight="700" fill="#17243a">Move down: row++</text><text x="510" y="233" font-size="14" fill="#475569">The current column is too small.</text><rect x="480" y="284" width="500" height="112" rx="16" fill="#fff1d6" stroke="#d7b965" stroke-width="2"/><text x="510" y="318" font-size="16" font-weight="700" fill="#334155">value &gt; target</text><text x="510" y="349" font-size="20" font-weight="700" fill="#17243a">Move left: col--</text><text x="510" y="375" font-size="14" fill="#475569">The current row is too large.</text><rect x="480" y="426" width="500" height="112" rx="16" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="510" y="460" font-size="16" font-weight="700" fill="#334155">value == target</text><text x="510" y="491" font-size="20" font-weight="700" fill="#17243a">Return found</text><text x="510" y="517" font-size="14" fill="#475569">The target is in the matrix.</text></g></svg>