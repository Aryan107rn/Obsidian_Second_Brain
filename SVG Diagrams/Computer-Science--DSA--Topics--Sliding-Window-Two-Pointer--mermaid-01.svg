<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="814" viewBox="0 0 1320 814" role="img" aria-labelledby="title desc"><title id="title">Sliding window and two-pointer guide</title><desc id="desc">A readable mapping of problem patterns to suitable algorithms, connected by arrows.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e78a30"/></marker></defs><g font-family="Arial,sans-serif"><text x="660" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#f4f7fc">Sliding window and two-pointer guide</text><text x="660" y="76" text-anchor="middle" font-size="16" fill="#cbd5e1">Use pointer movement to avoid revisiting every pair or substring.</text><text x="320" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#dbeafe">Problem pattern</text><text x="1000" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#dbeafe">Suggested technique</text><rect x="55" y="132" width="530" height="68" rx="15" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="320" y="166.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="320" dy="0">Longest window satisfying a constraint</tspan></text><path d="M590 166H720" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="735" y="132" width="530" height="68" rx="15" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="1000" y="166.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="1000" dy="0">Variable window: expand right, shrink while invalid</tspan></text><rect x="55" y="224" width="530" height="68" rx="15" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="320" y="258.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="320" dy="0">Shortest window satisfying a constraint</tspan></text><path d="M590 258H720" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="735" y="224" width="530" height="68" rx="15" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="1000" y="258.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="1000" dy="0">Expand until valid, then shrink while valid</tspan></text><rect x="55" y="316" width="530" height="68" rx="15" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="320" y="350.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="320" dy="0">Count windows with at most / exactly k items</tspan></text><path d="M590 350H720" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="735" y="316" width="530" height="68" rx="15" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="1000" y="350.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="1000" dy="0">Exactly k = atMost(k) − atMost(k − 1)</tspan></text><rect x="55" y="408" width="530" height="68" rx="15" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="320" y="442.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="320" dy="0">Maximum or minimum of every fixed-size window</tspan></text><path d="M590 442H720" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="735" y="408" width="530" height="68" rx="15" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="1000" y="442.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="1000" dy="0">Monotonic deque</tspan></text><rect x="55" y="500" width="530" height="68" rx="15" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="320" y="534.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="320" dy="0">Pair / triplet target in sorted data</tspan></text><path d="M590 534H720" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="735" y="500" width="530" height="68" rx="15" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="1000" y="534.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="1000" dy="0">Opposite-end two pointers</tspan></text><rect x="55" y="592" width="530" height="68" rx="15" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="320" y="626.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="320" dy="0">Filter or deduplicate in a sorted array in place</tspan></text><path d="M590 626H720" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="735" y="592" width="530" height="68" rx="15" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="1000" y="626.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="1000" dy="0">Same-direction slow / fast pointers</tspan></text><rect x="55" y="684" width="530" height="68" rx="15" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="320" y="718.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="320" dy="0">Every window has a fixed size k</tspan></text><path d="M590 718H720" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="735" y="684" width="530" height="68" rx="15" fill="#e3f6eb" stroke="#72b58c" stroke-width="2"/><text x="1000" y="718.0" text-anchor="middle" font-size="16" fill="#17243a"><tspan x="1000" dy="0">Add on the right; remove the item leaving on the left</tspan></text></g></svg>