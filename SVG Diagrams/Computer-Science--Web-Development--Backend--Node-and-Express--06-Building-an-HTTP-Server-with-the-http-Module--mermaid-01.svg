<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="716" viewBox="0 0 1440 716" role="img" aria-labelledby="title desc"><title id="title">A Node.js HTTP request reaches your callback</title><desc id="desc">A message sequence with explicit sender, receiver, direction arrows, and readable labels.</desc><defs><marker id="request" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e78a30"/></marker><marker id="response" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4f83cc"/></marker></defs><g font-family="Arial,sans-serif"><text x="720.0" y="44" text-anchor="middle" font-size="28" font-weight="700" fill="#f4f7fc">A Node.js HTTP request reaches your callback</text><rect x="15" y="76" width="310" height="62" rx="15" fill="#dce9ff" stroke="#7899c8" stroke-width="2"/><text x="170" y="111.0" text-anchor="middle" font-size="17" fill="#17243a" font-weight="700"><tspan x="170" dy="0">Browser</tspan></text><path d="M170 145V668" stroke="#94a6bd" stroke-width="2" stroke-dasharray="7 8"/><rect x="565" y="76" width="310" height="62" rx="15" fill="#dce9ff" stroke="#7899c8" stroke-width="2"/><text x="720" y="111.0" text-anchor="middle" font-size="17" fill="#17243a" font-weight="700"><tspan x="720" dy="0">Node.js HTTP server</tspan></text><path d="M720 145V668" stroke="#94a6bd" stroke-width="2" stroke-dasharray="7 8"/><rect x="1115" y="76" width="310" height="62" rx="15" fill="#dce9ff" stroke="#7899c8" stroke-width="2"/><text x="1270" y="111.0" text-anchor="middle" font-size="17" fill="#17243a" font-weight="700"><tspan x="1270" dy="0">Your callback (req, res)</tspan></text><path d="M1270 145V668" stroke="#94a6bd" stroke-width="2" stroke-dasharray="7 8"/><path d="M182 203H708" fill="none" stroke="#e78a30" stroke-width="3" marker-end="url(#request)"/><rect x="354.0" y="170.0" width="182" height="26" rx="8" fill="#f4f7fc" stroke="#c7d4e5" stroke-width="1"/><text x="445.0" y="18