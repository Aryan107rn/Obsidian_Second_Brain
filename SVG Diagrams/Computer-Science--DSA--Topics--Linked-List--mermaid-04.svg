<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc"><title id="title">Reverse a singly linked list</title><desc id="desc">Save the next node, reverse the current link, and advance prev and current pointers.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e78a30"/></marker></defs><g font-family="Arial,sans-serif"><text x="540" y="42" text-anchor="middle" font-size="27" font-weight="700" fill="#f4f7fc">Reverse a singly linked list: one iteration</text><text x="540" y="72" text-anchor="middle" font-size="16" fill="#cbd5e1">Preserve the forward link before reversing the current node</text><rect x="90" y="112" width="270" height="68" rx="15" fill="#dce9ff" stroke="#7899c8" stroke-width="2"/><text x="225" y="153" text-anchor="middle" font-size="20" font-weight="700" fill="#17243a">1. Save next</text><rect x="90" y="202" width="270" height="54" rx="12" fill="#f4f7fc" stroke="#7899c8"/><text x="225" y="236" text-anchor="middle" font-size="16" fill="#17243a">next = curr.next</text><path d="M360 146H384" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="390" y="112" width="270" height="68" rx="15" fill="#dce9ff" stroke="#7899c8" stroke-width="2"/><text x="525" y="153" text-anchor="middle" font-size="20" font-weight="700" fill="#17243a">2. Reverse link</text><rect x="390" y="202" width="270" height="54" rx="12" fill="#f4f7fc" stroke="#7899c8"/><text x="525" y="236" text-anchor="middle" font-size="16" fill="#17243a">curr.next = prev</text><path d="M660 146H684" stroke="#e78a30" stroke-width="3" marker-end="url(#arrow)"/><rect x="690" y="112" width="270" height="68" rx="15" fill="#dce9ff" stroke="#7899c8" stroke-width="2"/><text x="825" y="153" text-anchor="middle" font-size="20" font-weight="700" fill="#17243a">3. Advance</text><rect x="690" y="202" width="270" height="54" rx="12" fill="#f4f7fc" stroke="#7899c8"/><text x="825" y="236" text-anchor="middle" font-size="16" fill="#17243a">prev = curr; curr = next</text><rect x="90" y="310" width="270" height="142" rx="16" fill="#f4f7fc" stroke="#7899c8" stroke-width="2"/><text x="225" y="342" text-anchor="middle" font-size="17" font-weight="700" fill="#17243a">Before reversal</text><text x="225" y="380" text-anchor="middle" font-size="16" fill="#17243a">prev = null</text><text x="225" y="408" text-anchor="middle" font-size="16" fill="#17243a">curr → A → B</text><text x="225" y="435" text-anchor="middle" font-size="13" fill="#475569">save next = B</text><rect x="390" y="310" width="270" height="142" rx="16" fill="#fff1d6" stroke="#7899c8" stroke-width="2"/><text x="525" y="342" text-anchor="middle" font-size="17" font-weight="700" fill="#17243a">After flipping A</text><text x="525" y="380" text-anchor="middle" font-size="16" fill="#17243a">prev = A</text><text x="525" y="408" text-anchor="middle" font-size="16" fill="#17243a">curr = A; A → null</text><text x="525" y="435" text-anchor="middle" font-size="13" fill="#475569">B remains saved</text><rect x="690" y="310" width="270" height="142" rx="16" fill="#e3f6eb" stroke="#7899c8" stroke-width="2"/><text x="825" y="342" text-anchor="middle" font-size="17" font-weight="700" fill="#17243a">Next iteration</text><text x="825" y="380" text-anchor="middle" font-size="16" fill="#17243a">prev = A</text><text x="825" y="408" text-anchor="middle" font-size="16" fill="#17243a">curr = B → C</text><text x="825" y="435" text-anchor="middle" font-size="13" fill="#475569">repeat the three steps</text></g></svg>