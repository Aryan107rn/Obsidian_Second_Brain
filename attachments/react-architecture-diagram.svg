<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <rect width="900" height="360" rx="16" fill="#081b26" stroke="#00d8ff" stroke-width="2"/>
  <text x="450" y="42" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">REACT ARCHITECTURE: VIRTUAL DOM &amp; RECONCILIATION</text>

  <!-- Step 1: State Change -->
  <g transform="translate(40, 80)">
    <rect width="220" height="230" rx="12" fill="#0f293d" stroke="#0284c7" stroke-width="2"/>
    <rect width="220" height="36" rx="12" fill="#0284c7"/>
    <text x="110" y="24" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">1. STATE / PROP CHANGE</text>
    <text x="110" y="80" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="13">setCount(count + 1)</text>
    <text x="110" y="120" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Component re-renders</text>
    <text x="110" y="160" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12">Produces new JSX</text>
    <text x="110" y="200" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">In-Memory Execution</text>
  </g>

  <!-- Step 2: Virtual DOM Diffing -->
  <g transform="translate(300, 80)">
    <rect width="300" height="230" rx="12" fill="#0f293d" stroke="#00d8ff" stroke-width="2"/>
    <rect width="300" height="36" rx="12" fill="#0369a1"/>
    <text x="150" y="24" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">2. VIRTUAL DOM DIFFING</text>
    <rect x="20" y="55" width="120" height="100" rx="8" fill="#1e293b" stroke="#64748b"/>
    <text x="80" y="85" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Previous VDOM</text>
    <text x="80" y="115" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="11">&lt;h1&gt;0&lt;/h1&gt;</text>

    <rect x="160" y="55" width="120" height="100" rx="8" fill="#1e293b" stroke="#00d8ff"/>
    <text x="220" y="85" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Next VDOM</text>
    <text x="220" y="115" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11">&lt;h1&gt;1&lt;/h1&gt;</text>

    <text x="150" y="185" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">⚡ Fiber Reconciliation</text>
    <text x="150" y="210" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Calculates minimal delta</text>
  </g>

  <!-- Step 3: Real DOM Mutation -->
  <g transform="translate(640, 80)">
    <rect width="220" height="230" rx="12" fill="#0f293d" stroke="#10b981" stroke-width="2"/>
    <rect width="220" height="36" rx="12" fill="#059669"/>
    <text x="110" y="24" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">3. REAL DOM COMMIT</text>
    <text x="110" y="80" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="13">node.textContent = &quot;1&quot;</text>
    <text x="110" y="120" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Batched DOM Update</text>
    <text x="110" y="160" text-anchor="middle" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12">Zero full-page repaint</text>
    <text x="110" y="200" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">60 FPS UI Performance</text>
  </g>
</svg>