<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <linearGradient id="restBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091E3A"/>
      <stop offset="100%" stop-color="#2F80ED"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="900" height="360" rx="16" fill="#0b1329" stroke="#1e3a8a" stroke-width="2"/>
  <text x="450" y="42" text-anchor="middle" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">RESTful REQUEST &amp; RESPONSE LIFECYCLE</text>

  <!-- Client Card -->
  <g transform="translate(50, 80)">
    <rect width="220" height="230" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2"/>
    <rect width="220" height="36" rx="12" fill="#0284c7"/>
    <text x="110" y="24" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">HTTP CLIENT</text>
    <text x="20" y="70" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">GET /users/42</text>
    <text x="20" y="95" fill="#94a3b8" font-family="monospace" font-size="11">Host: api.site.com</text>
    <text x="20" y="115" fill="#94a3b8" font-family="monospace" font-size="11">Accept: app/json</text>
    <text x="20" y="135" fill="#94a3b8" font-family="monospace" font-size="11">Auth: Bearer token</text>
    <path d="M 20 155 L 200 155" stroke="#334155" stroke-width="1"/>
    <text x="110" y="185" text-anchor="middle" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12">✓ Stateless Request</text>
    <text x="110" y="205" text-anchor="middle" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12">✓ Cachable</text>
  </g>

  <!-- Flow Arrows -->
  <g transform="translate(290, 140)">
    <path d="M 0 0 L 160 0" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4"/>
    <polygon points="165,0 155,-5 155,5" fill="#38bdf8"/>
    <text x="80" y="-10" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">1. HTTP Request (Verbs)</text>
  </g>
  <g transform="translate(290, 220)">
    <path d="M 160 0 L 0 0" stroke="#4ade80" stroke-width="3" stroke-dasharray="6,4"/>
    <polygon points="-5,0 5,-5 5,5" fill="#4ade80"/>
    <text x="80" y="-10" text-anchor="middle" fill="#4ade80" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">2. HTTP Response (Status + JSON)</text>
  </g>

  <!-- Server Card -->
  <g transform="translate(470, 80)">
    <rect width="380" height="230" rx="12" fill="url(#cardGrad)" stroke="#4ade80" stroke-width="2"/>
    <rect width="380" height="36" rx="12" fill="#16a34a"/>
    <text x="190" y="24" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">REST SERVER &amp; DATABASE</text>
    <text x="20" y="70" fill="#4ade80" font-family="monospace" font-size="13" font-weight="bold">HTTP/1.1 200 OK</text>
    <text x="20" y="92" fill="#94a3b8" font-family="monospace" font-size="11">Content-Type: application/json</text>
    <rect x="20" y="105" width="340" height="105" rx="6" fill="#020617" stroke="#1e293b"/>
    <text x="30" y="128" fill="#cbd5e1" font-family="monospace" font-size="11">{</text>
    <text x="45" y="148" fill="#f59e0b" font-family="monospace" font-size="11">&quot;id&quot;: <tspan fill="#60a5fa">42</tspan>,</text>
    <text x="45" y="168" fill="#f59e0b" font-family="monospace" font-size="11">&quot;name&quot;: <tspan fill="#34d399">&quot;Asha Sharma&quot;</tspan>,</text>
    <text x="45" y="188" fill="#f59e0b" font-family="monospace" font-size="11">&quot;role&quot;: <tspan fill="#34d399">&quot;Senior Engineer&quot;</tspan></text>
    <text x="30" y="203" fill="#cbd5e1" font-family="monospace" font-size="11">}</text>
  </g>
</svg>