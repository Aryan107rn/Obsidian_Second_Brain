<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <rect width="900" height="360" rx="16" fill="#0a192f" stroke="#38bdf8" stroke-width="2"/>
  <text x="450" y="42" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">useState RENDER &amp; UPDATE CYCLE</text>

  <g transform="translate(50, 80)">
    <rect width="240" height="230" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="240" height="36" rx="12" fill="#0284c7"/>
    <text x="120" y="24" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">1. INITIAL MOUNT</text>
    <text x="20" y="75" fill="#7dd3fc" font-family="monospace" font-size="12">const [count, setCount] =</text>
    <text x="30" y="98" fill="#7dd3fc" font-family="monospace" font-size="12">  useState(0);</text>
    <text x="120" y="145" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Initial state allocated</text>
    <text x="120" y="180" text-anchor="middle" fill="#4ade80" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">UI renders: count = 0</text>
  </g>

  <g transform="translate(330, 80)">
    <rect width="240" height="230" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect width="240" height="36" rx="12" fill="#d97706"/>
    <text x="120" y="24" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">2. USER ACTION</text>
    <text x="20" y="75" fill="#fde68a" font-family="monospace" font-size="12">&lt;button onClick={() =&gt;</text>
    <text x="30" y="98" fill="#fde68a" font-family="monospace" font-size="12">  setCount(c =&gt; c + 1)</text>
    <text x="20" y="121" fill="#fde68a" font-family="monospace" font-size="12">}&gt;</text>
    <text x="120" y="160" text-anchor="middle" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Schedules Re-render</text>
    <text x="120" y="190" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">State update queued</text>
  </g>

  <g transform="translate(610, 80)">
    <rect width="240" height="230" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="240" height="36" rx="12" fill="#059669"/>
    <text x="120" y="24" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">3. RE-RENDER</text>
    <text x="120" y="80" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13">Component runs again</text>
    <text x="20" y="120" fill="#6ee7b7" font-family="monospace" font-size="12">const [count] = useState(0);</text>
    <text x="120" y="155" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">React returns new value (1)</text>
    <text x="120" y="190" text-anchor="middle" fill="#4ade80" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">UI updates: count = 1</text>
  </g>
</svg>