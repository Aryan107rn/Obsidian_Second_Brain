<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <rect width="900" height="360" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="450" y="42" text-anchor="middle" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">WEBSOCKET FULL-DUPLEX PERSISTENT CONNECTION</text>

  <!-- Left: Client -->
  <g transform="translate(50, 80)">
    <rect width="200" height="230" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <rect width="200" height="36" rx="12" fill="#e11d48"/>
    <text x="100" y="24" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">CLIENT (BROWSER)</text>
    <text x="100" y="80" text-anchor="middle" fill="#fda4af" font-family="system-ui, sans-serif" font-size="13">new WebSocket()</text>
    <text x="100" y="120" text-anchor="middle" fill="#fda4af" font-family="system-ui, sans-serif" font-size="13">onmessage event</text>
    <text x="100" y="160" text-anchor="middle" fill="#fda4af" font-family="system-ui, sans-serif" font-size="13">socket.send()</text>
    <text x="100" y="200" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Single TCP Connection</text>
  </g>

  <!-- Center Channel -->
  <g transform="translate(275, 80)">
    <rect width="350" height="230" rx="12" fill="#020617" stroke="#475569" stroke-dasharray="4,4"/>
    <!-- Handshake -->
    <text x="175" y="28" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">1. HTTP Upgrade Handshake (101 Switching Protocols)</text>
    <path d="M 20 40 L 330 40" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
    
    <!-- Pipe Visual -->
    <rect x="30" y="60" width="290" height="140" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
    <text x="175" y="85" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">PERSISTENT FULL-DUPLEX TCP PIPE</text>
    
    <path d="M 40 115 L 290 115" stroke="#38bdf8" stroke-width="3"/>
    <polygon points="295,115 285,110 285,120" fill="#38bdf8"/>
    <text x="165" y="108" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11">Client Msg Frame (2-6B overhead)</text>

    <path d="M 290 155 L 40 155" stroke="#4ade80" stroke-width="3"/>
    <polygon points="35,155 45,150 45,160" fill="#4ade80"/>
    <text x="165" y="148" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="11">Server Push Frame (Instant push!)</text>

    <text x="175" y="185" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">ws:// (Port 80) / wss:// (Port 443 TLS)</text>
  </g>

  <!-- Right: Server -->
  <g transform="translate(650, 80)">
    <rect width="200" height="230" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="200" height="36" rx="12" fill="#059669"/>
    <text x="100" y="24" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">WEBSOCKET SERVER</text>
    <text x="100" y="80" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13">Active Connection Pool</text>
    <text x="100" y="120" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13">Redis Pub/Sub Sync</text>
    <text x="100" y="160" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13">Event Broadcaster</text>
    <text x="100" y="200" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Stateful TCP Session</text>
  </g>
</svg>