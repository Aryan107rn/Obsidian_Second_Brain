<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <rect width="900" height="360" rx="16" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
  <text x="450" y="42" text-anchor="middle" fill="#fb923c" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">LINUX DIRECTORY TREE &amp; PERMISSION ARCHITECTURE</text>

  <!-- Root / Tree -->
  <g transform="translate(50, 75)">
    <rect width="420" height="250" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect width="420" height="32" rx="12" fill="#0284c7"/>
    <text x="210" y="22" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">FILESYSTEM HIERARCHY (FHS)</text>
    
    <text x="20" y="65" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">/ (Root Directory)</text>
    <text x="35" y="90" fill="#94a3b8" font-family="monospace" font-size="11">├── <b>/bin</b>   Essential user command binaries (ls, cat, cp)</text>
    <text x="35" y="115" fill="#94a3b8" font-family="monospace" font-size="11">├── <b>/etc</b>   System-wide configuration files (nginx.conf, hosts)</text>
    <text x="35" y="140" fill="#94a3b8" font-family="monospace" font-size="11">├── <b>/home</b>  User personal directories (/home/aryan)</text>
    <text x="35" y="165" fill="#94a3b8" font-family="monospace" font-size="11">├── <b>/var</b>   Variable data (logs, databases, /var/log/syslog)</text>
    <text x="35" y="190" fill="#94a3b8" font-family="monospace" font-size="11">├── <b>/tmp</b>   Temporary files cleared on reboot</text>
    <text x="35" y="215" fill="#94a3b8" font-family="monospace" font-size="11">└── <b>/proc</b>  Virtual kernel process filesystem</text>
  </g>

  <!-- Permissions Right -->
  <g transform="translate(500, 75)">
    <rect width="350" height="250" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <rect width="350" height="32" rx="12" fill="#059669"/>
    <text x="175" y="22" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">FILE PERMISSIONS (chmod 755)</text>
    
    <rect x="25" y="50" width="300" height="50" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="82" fill="#fbbf24" font-family="monospace" font-size="16">- r w x r - x r - x</text>
    <text x="35" y="120" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11">[User: rwx (7)] [Group: r-x (5)] [Others: r-x (5)]</text>
    
    <path d="M 20 140 L 330 140" stroke="#334155" stroke-width="1"/>
    <text x="25" y="170" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• <b>r (Read):</b> 4 | <b>w (Write):</b> 2 | <b>x (Exec):</b> 1</text>
    <text x="25" y="195" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• <b>chmod 777:</b> Read, write, execute for everyone</text>
    <text x="25" y="220" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• <b>chmod 600:</b> Read/write for owner only (SSH keys)</text>
  </g>
</svg>