<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <rect width="900" height="360" rx="16" fill="#18181b" stroke="#f97316" stroke-width="2"/>
  <text x="450" y="42" text-anchor="middle" fill="#fb923c" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">GIT 4-TIER ARCHITECTURE &amp; WORKFLOW</text>

  <!-- 1. Working Dir -->
  <g transform="translate(30, 80)">
    <rect width="180" height="230" rx="12" fill="#27272a" stroke="#ef4444" stroke-width="2"/>
    <rect width="180" height="36" rx="12" fill="#dc2626"/>
    <text x="90" y="24" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">WORKING DIRECTORY</text>
    <text x="90" y="80" text-anchor="middle" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12">Local files on disk</text>
    <text x="90" y="120" text-anchor="middle" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12">Unstaged changes</text>
    <text x="90" y="160" text-anchor="middle" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12">Modified / Untracked</text>
    <text x="90" y="200" text-anchor="middle" fill="#a1a1aa" font-family="monospace" font-size="11">git status (Red)</text>
  </g>

  <!-- 2. Staging -->
  <g transform="translate(250, 80)">
    <rect width="180" height="230" rx="12" fill="#27272a" stroke="#f59e0b" stroke-width="2"/>
    <rect width="180" height="36" rx="12" fill="#d97706"/>
    <text x="90" y="24" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">STAGING AREA (INDEX)</text>
    <text x="90" y="80" text-anchor="middle" fill="#fde68a" font-family="system-ui, sans-serif" font-size="12">Ready to commit</text>
    <text x="90" y="120" text-anchor="middle" fill="#fde68a" font-family="monospace" font-size="11">git add &lt;file&gt;</text>
    <text x="90" y="160" text-anchor="middle" fill="#fde68a" font-family="system-ui, sans-serif" font-size="12">Pre-commit snapshot</text>
    <text x="90" y="200" text-anchor="middle" fill="#a1a1aa" font-family="monospace" font-size="11">git status (Green)</text>
  </g>

  <!-- 3. Local Repo -->
  <g transform="translate(470, 80)">
    <rect width="180" height="230" rx="12" fill="#27272a" stroke="#3b82f6" stroke-width="2"/>
    <rect width="180" height="36" rx="12" fill="#2563eb"/>
    <text x="90" y="24" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">LOCAL REPO (.git)</text>
    <text x="90" y="80" text-anchor="middle" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12">Committed history</text>
    <text x="90" y="120" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="11">git commit -m &quot;...&quot;</text>
    <text x="90" y="160" text-anchor="middle" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12">HEAD pointer &amp; hashes</text>
    <text x="90" y="200" text-anchor="middle" fill="#a1a1aa" font-family="monospace" font-size="11">git log / branch</text>
  </g>

  <!-- 4. Remote Repo -->
  <g transform="translate(690, 80)">
    <rect width="180" height="230" rx="12" fill="#27272a" stroke="#10b981" stroke-width="2"/>
    <rect width="180" height="36" rx="12" fill="#059669"/>
    <text x="90" y="24" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">REMOTE (GITHUB)</text>
    <text x="90" y="80" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12">Cloud hosted repo</text>
    <text x="90" y="120" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="11">git push origin</text>
    <text x="90" y="160" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="11">git pull / fetch</text>
    <text x="90" y="200" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">Team Collaboration</text>
  </g>
</svg>