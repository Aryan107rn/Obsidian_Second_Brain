<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="900" height="360" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  <text x="450" y="42" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" letter-spacing="1">API SYSTEM ARCHITECTURE</text>

  <!-- Client Box -->
  <g transform="translate(40, 90)">
    <rect width="180" height="210" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect width="180" height="36" rx="12" fill="url(#boxGrad1)"/>
    <text x="90" y="24" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">CLIENT LAYER</text>
    <text x="90" y="75" text-anchor="middle" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="13">🌐 Web App (React)</text>
    <text x="90" y="115" text-anchor="middle" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="13">📱 Mobile (iOS/Android)</text>
    <text x="90" y="155" text-anchor="middle" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="13">💻 3rd Party Server</text>
    <text x="90" y="190" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Sends HTTP/WS</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 230 195 L 310 195" stroke="#60a5fa" stroke-width="3" stroke-dasharray="6,6" fill="none"/>
  <polygon points="315,195 305,190 305,200" fill="#60a5fa"/>
  <text x="270" y="180" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="11">JSON / Req</text>

  <!-- Gateway Box -->
  <g transform="translate(325, 80)">
    <rect width="230" height="230" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="230" height="36" rx="12" fill="url(#boxGrad2)"/>
    <text x="115" y="24" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">API GATEWAY</text>
    <text x="115" y="70" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13">🔐 Auth &amp; JWT Verify</text>
    <text x="115" y="105" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13">🚦 Rate Limiting &amp; Quota</text>
    <text x="115" y="140" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13">🔀 Load Balancing &amp; SSL</text>
    <text x="115" y="175" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13">📦 Request Routing</text>
    <text x="115" y="210" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Reverse Proxy</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 565 195 L 645 195" stroke="#a78bfa" stroke-width="3" stroke-dasharray="6,6" fill="none"/>
  <polygon points="650,195 640,190 640,200" fill="#a78bfa"/>
  <text x="605" y="180" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="11">Internal RPC</text>

  <!-- Services Box -->
  <g transform="translate(660, 90)">
    <rect width="200" height="210" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <rect width="200" height="36" rx="12" fill="url(#boxGrad3)"/>
    <text x="100" y="24" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">MICROSERVICES</text>
    <text x="100" y="75" text-anchor="middle" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="13">👤 User Service</text>
    <text x="100" y="115" text-anchor="middle" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="13">💳 Payment Service</text>
    <text x="100" y="155" text-anchor="middle" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="13">📦 Order Service</text>
    <text x="100" y="190" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12">🗄️ SQL / Cache / NoSQL</text>
  </g>
</svg>