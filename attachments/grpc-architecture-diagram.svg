<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <rect width="900" height="360" rx="16" fill="#042f2e" stroke="#14b8a6" stroke-width="2"/>
  <text x="450" y="42" text-anchor="middle" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">gRPC PROTOBUF BINARY RPC ARCHITECTURE</text>

  <g transform="translate(50, 80)">
    <rect width="220" height="230" rx="12" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
    <rect width="220" height="36" rx="12" fill="#0d9488"/>
    <text x="110" y="24" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">CLIENT STUB (Go / Py)</text>
    <text x="20" y="75" fill="#99f6e4" font-family="monospace" font-size="12">client.GetUser(req)</text>
    <text x="110" y="120" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Calls local function</text>
    <text x="110" y="150" text-anchor="middle" fill="#5eead4" font-family="system-ui, sans-serif" font-size="12">Protobuf Serializer</text>
    <text x="110" y="195" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11">Compact Binary Output</text>
  </g>

  <g transform="translate(305, 80)">
    <rect width="290" height="230" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect width="290" height="36" rx="12" fill="#0284c7"/>
    <text x="145" y="24" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">HTTP/2 BINARY MULTIPLEXING</text>
    <text x="145" y="75" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Single TCP Connection</text>
    <rect x="20" y="95" width="250" height="30" rx="6" fill="#1e293b"/>
    <text x="145" y="115" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11">Stream 1: Binary Frame [12B]</text>
    <rect x="20" y="135" width="250" height="30" rx="6" fill="#1e293b"/>
    <text x="145" y="155" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="11">Stream 2: Binary Frame [18B]</text>
    <text x="145" y="195" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Zero Head-of-Line Blocking</text>
  </g>

  <g transform="translate(630, 80)">
    <rect width="220" height="230" rx="12" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
    <rect width="220" height="36" rx="12" fill="#0d9488"/>
    <text x="110" y="24" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">SERVER SERVICE (Java/C++)</text>
    <text x="110" y="80" text-anchor="middle" fill="#5eead4" font-family="system-ui, sans-serif" font-size="12">Protobuf Deserializer</text>
    <text x="110" y="125" text-anchor="middle" fill="#99f6e4" font-family="monospace" font-size="12">UserServiceImpl</text>
    <text x="110" y="160" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Executes business logic</text>
    <text x="110" y="195" text-anchor="middle" fill="#22c55e" font-family="system-ui, sans-serif" font-size="11">Returns Typed Response</text>
  </g>
</svg>