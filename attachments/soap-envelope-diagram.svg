<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <rect width="900" height="360" rx="16" fill="#261904" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="42" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">SOAP XML ENVELOPE &amp; WSDL CONTRACT</text>

  <!-- Left: Envelope Structure -->
  <g transform="translate(50, 75)">
    <rect width="420" height="245" rx="12" fill="#382405" stroke="#f59e0b" stroke-width="2"/>
    <rect width="420" height="32" rx="12" fill="#b45309"/>
    <text x="210" y="22" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">&lt;soap:Envelope&gt; (Root Wrapper)</text>
    
    <!-- Header -->
    <rect x="20" y="45" width="380" height="75" rx="8" fill="#451a03" stroke="#fb923c"/>
    <text x="35" y="68" fill="#fdba74" font-family="monospace" font-size="12" font-weight="bold">&lt;soap:Header&gt; (Security &amp; Metadata)</text>
    <text x="45" y="88" fill="#fed7aa" font-family="monospace" font-size="10">• WS-Security (Digital Signatures &amp; Encrypted Tokens)</text>
    <text x="45" y="105" fill="#fed7aa" font-family="monospace" font-size="10">• WS-AtomicTransaction (Distributed 2PC ID)</text>

    <!-- Body -->
    <rect x="20" y="130" width="380" height="95" rx="8" fill="#451a03" stroke="#4ade80"/>
    <text x="35" y="153" fill="#86efac" font-family="monospace" font-size="12" font-weight="bold">&lt;soap:Body&gt; (Payload / Method Invocation)</text>
    <text x="45" y="173" fill="#bbf7d0" font-family="monospace" font-size="10">&lt;TransferFunds&gt;</text>
    <text x="60" y="190" fill="#bbf7d0" font-family="monospace" font-size="10">&lt;From&gt;ACC-101&lt;/From&gt; &lt;Amount currency=&quot;USD&quot;&gt;5000&lt;/Amount&gt;</text>
    <text x="45" y="208" fill="#bbf7d0" font-family="monospace" font-size="10">&lt;/TransferFunds&gt; (or &lt;soap:Fault&gt; on Error)</text>
  </g>

  <!-- Right: WSDL Contract -->
  <g transform="translate(500, 75)">
    <rect width="350" height="245" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="350" height="32" rx="12" fill="#0284c7"/>
    <text x="175" y="22" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">WSDL CONTRACT &amp; CODEGEN</text>
    <text x="25" y="65" fill="#38bdf8" font-family="monospace" font-size="11">&lt;types&gt; XSD Data Types</text>
    <text x="25" y="90" fill="#38bdf8" font-family="monospace" font-size="11">&lt;message&gt; In / Out Parameters</text>
    <text x="25" y="115" fill="#38bdf8" font-family="monospace" font-size="11">&lt;portType&gt; Service Operations</text>
    <text x="25" y="140" fill="#38bdf8" font-family="monospace" font-size="11">&lt;binding&gt; SOAP over HTTP/SMTP</text>
    <path d="M 20 160 L 330 160" stroke="#475569" stroke-width="1"/>
    <text x="175" y="185" text-anchor="middle" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Auto-generates Enterprise Stubs</text>
    <text x="175" y="210" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">☕ Java (JAX-WS) | 🔷 .NET (WCF)</text>
  </g>
</svg>