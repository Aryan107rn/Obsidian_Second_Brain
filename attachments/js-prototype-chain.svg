<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <rect width="900" height="360" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
  <text x="450" y="42" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">JAVASCRIPT PROTOTYPAL INHERITANCE CHAIN</text>

  <g transform="translate(50, 80)">
    <rect width="220" height="230" rx="12" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
    <rect width="220" height="36" rx="12" fill="#4338ca"/>
    <text x="110" y="24" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">1. INSTANCE (dog)</text>
    <text x="20" y="80" fill="#c7d2fe" font-family="monospace" font-size="12">name: &quot;Rex&quot;</text>
    <text x="20" y="110" fill="#c7d2fe" font-family="monospace" font-size="12">breed: &quot;German Shepherd&quot;</text>
    <path d="M 20 140 L 200 140" stroke="#4f46e5" stroke-width="1"/>
    <text x="110" y="175" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="12">dog.__proto__ ──&gt;</text>
    <text x="110" y="200" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Points to Dog.prototype</text>
  </g>

  <g transform="translate(340, 80)">
    <rect width="220" height="230" rx="12" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
    <rect width="220" height="36" rx="12" fill="#4338ca"/>
    <text x="110" y="24" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">2. Dog.prototype</text>
    <text x="20" y="80" fill="#c7d2fe" font-family="monospace" font-size="12">bark: function()</text>
    <text x="20" y="110" fill="#c7d2fe" font-family="monospace" font-size="12">eat: function()</text>
    <path d="M 20 140 L 200 140" stroke="#4f46e5" stroke-width="1"/>
    <text x="110" y="175" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="12">.__proto__ ──&gt;</text>
    <text x="110" y="200" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Points to Object.prototype</text>
  </g>

  <g transform="translate(630, 80)">
    <rect width="220" height="230" rx="12" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
    <rect width="220" height="36" rx="12" fill="#4338ca"/>
    <text x="110" y="24" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">3. Object.prototype</text>
    <text x="20" y="80" fill="#c7d2fe" font-family="monospace" font-size="12">toString()</text>
    <text x="20" y="110" fill="#c7d2fe" font-family="monospace" font-size="12">hasOwnProperty()</text>
    <path d="M 20 140 L 200 140" stroke="#4f46e5" stroke-width="1"/>
    <text x="110" y="175" text-anchor="middle" fill="#ef4444" font-family="monospace" font-size="12">.__proto__ == null</text>
    <text x="110" y="200" text-anchor="middle" fill="#f87171" font-family="system-ui, sans-serif" font-size="11">End of Prototype Chain</text>
  </g>
</svg>